name: Publish Dennis Ross Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dennis-ross-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build static GitHub Pages site
        run: npm run build:pages
      - name: Verify static pages
        run: npm run test:pages
      - name: Package Hostinger-ready website ZIP
        run: python3 scripts/package-hostinger.py
      - name: Publish to existing gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.pages-build/app/out
          publish_branch: gh-pages
          keep_files: false
          force_orphan: false
